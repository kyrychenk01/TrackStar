<style>
:root{color-scheme:dark;--bg:#0e0e0e;--card:#262626;--c2:#333;--tx:#f5f5f5;--mu:#8d8d8d;--bd:#3d3d3d;--ac:#e5ff56;--ac2:#111;--mint:#7ff5dd}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.45 Rubik,system-ui,sans-serif;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;width:75vmax;height:75vmax;border-radius:50%;filter:blur(90px);pointer-events:none}
body::before{background:#6d7d10;opacity:.4;top:-40vmax;left:-30vmax;animation:d1 16s ease-in-out infinite alternate}
body::after{background:#0f8a74;opacity:.28;bottom:-45vmax;right:-35vmax;animation:d2 20s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(25vmax,18vmax) scale(1.2)}}
@keyframes d2{to{transform:translate(-22vmax,-20vmax) scale(1.15)}}
.w{max-width:760px;margin:0 auto;padding:16px}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes slide{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes zoom{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes fill{from{width:0}}
@keyframes twk{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.18) rotate(22deg)}}
@keyframes spin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(200deg) scale(1.5)}100%{transform:rotate(360deg) scale(1)}}
@keyframes flt{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(8deg)}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes logoin{0%{transform:scale(0) rotate(-270deg);opacity:0}65%{transform:scale(1.25) rotate(20deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes ltr{from{opacity:0;transform:translateY(30px) rotate(8deg)}to{opacity:1;transform:none}}
@keyframes sout{to{opacity:0;visibility:hidden;transform:scale(1.15)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--ac) 50%,transparent))}50%{filter:drop-shadow(0 0 22px color-mix(in srgb,var(--ac) 95%,transparent))}}
.lg{fill:var(--ac);display:block;flex:none}
#sp{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;animation:sout .6s 2.1s forwards}
#sp .lg{width:110px;height:110px;animation:logoin 1s cubic-bezier(.2,.9,.3,1.2) both,glow 1.6s 1s infinite}
#sp .nm2{font-size:42px;font-weight:700;letter-spacing:-1px}
.ltr{display:inline-block;opacity:0;animation:ltr .6s cubic-bezier(.2,.9,.3,1.3) forwards}
.ltr.s{color:var(--ac)}
h1{margin:6px 0 14px;display:flex;justify-content:space-between;align-items:center;animation:drop .6s both}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:26px;letter-spacing:-.5px;cursor:pointer;user-select:none}
.brand .lg{width:34px;height:34px;animation:twk 4s ease-in-out infinite,glow 3s ease-in-out infinite}
.brand .lg.spin{animation:spin .9s cubic-bezier(.3,1.3,.5,1)}
.brand:hover .lg{animation:spin .9s}
.st{font-size:12px;color:var(--mu);font-weight:300}
.me{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;animation:drop .5s .05s both}
.me:empty{display:none}
.me small{color:var(--mu);display:block;font-size:13px;font-weight:300}
.hi{font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--card);padding:5px;border-radius:20px;animation:drop .6s .1s both}
.tabs button{flex:1;padding:11px 2px;border:0;border-radius:15px;background:none;color:var(--mu);font:500 12px Rubik,sans-serif;cursor:pointer;transition:background .3s,color .3s,transform .15s}
.tabs button:hover{color:var(--tx)}
.tabs button:active{transform:scale(.92)}
.tabs button.on{background:var(--ac);color:var(--ac2);animation:pop .4s}
.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:16px;transition:transform .3s,box-shadow .3s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.45)}
.anim .card,.anim .stats{animation:up .6s cubic-bezier(.2,.8,.2,1) both}
.anim .card:nth-child(2){animation-delay:.08s}.anim .card:nth-child(3){animation-delay:.16s}.anim .card:nth-child(4){animation-delay:.24s}
h2{font-size:17px;font-weight:700;margin:0 0 10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.tile{border-radius:24px;padding:16px;color:var(--ac2);transition:transform .3s}
.tile:hover{transform:scale(1.04) rotate(-1deg)}
.tile small{display:block;font-size:13px;font-weight:500;opacity:.75}
.t1{background:var(--ac)}.t2{background:var(--mint)}
.num{font-size:40px;font-weight:700;line-height:1.1;text-align:right;letter-spacing:-1px}
.bar{height:7px;border-radius:5px;background:rgba(0,0,0,.18);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:#111;border-radius:5px}
.anim .bar i{animation:fill 1.1s .3s cubic-bezier(.2,.8,.2,1) both}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:500;font-size:18px}
button{font-family:inherit}
.ib{border:0;background:var(--c2);color:var(--tx);border-radius:12px;padding:7px 15px;cursor:pointer;font-size:15px;transition:transform .2s,background .2s,color .2s}
.ib:hover{background:var(--ac);color:var(--ac2);transform:scale(1.1)}
.ib:active{transform:scale(.88)}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dn{font-size:12px;color:var(--mu);text-align:center;font-weight:500}
.d{aspect-ratio:1/1;border:0;border-radius:14px;background:var(--c2);color:var(--tx);padding:3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;font:500 14px Rubik,sans-serif;transition:transform .25s,background .25s,color .25s}
.anim .d{animation:zoom .45s both}
.d:hover{transform:scale(1.14) rotate(-3deg);z-index:1}
.d:active{transform:scale(.88)}
.d.o{background:none;cursor:default;pointer-events:none}
.d.t{box-shadow:inset 0 0 0 2px var(--ac)}
.d.s,.d.s:hover{background:var(--ac);color:var(--ac2);box-shadow:0 0 18px color-mix(in srgb,var(--ac) 45%,transparent)}
.d.s{animation:pop .4s}
.d small{font-size:10px;line-height:1;font-weight:400;min-height:10px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);animation:slide .45s both}
.row:nth-child(2){animation-delay:.05s}.row:nth-child(3){animation-delay:.1s}.row:nth-child(4){animation-delay:.15s}.row:nth-child(5){animation-delay:.2s}.row:nth-child(6){animation-delay:.25s}
.row:last-child{border-bottom:0}
.row label{flex:1;display:flex;align-items:center;gap:10px;cursor:pointer}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:26px;height:26px;border:2px solid #666;border-radius:9px;margin:0;flex:none;cursor:pointer;position:relative;transition:background .25s,border-color .25s,transform .2s}
input[type=checkbox]:hover{transform:scale(1.15);border-color:var(--ac)}
input[type=checkbox]::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid var(--ac2);border-width:0 3px 3px 0;transform:rotate(45deg) scale(0);transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
input[type=checkbox]:checked{background:var(--ac);border-color:var(--ac);animation:pop .4s}
input[type=checkbox]:checked::after{transform:rotate(45deg) scale(1)}
.row span{background:linear-gradient(var(--mu),var(--mu)) no-repeat left 55%/0 2px;transition:background-size .4s,color .3s}
.done span{background-size:100% 2px;color:var(--mu)}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:22px;padding:0 6px;line-height:1;transition:transform .3s,color .2s}
.x:hover{color:var(--ac);transform:rotate(90deg) scale(1.3)}
.add{display:flex;gap:8px;margin-top:12px}
input[type=text],input[type=password],input[type=time],textarea{font:400 15px Rubik,sans-serif;border:2px solid transparent;background:var(--c2);color:var(--tx);border-radius:14px;padding:11px;outline:0;transition:border-color .25s,box-shadow .25s}
input:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 16px color-mix(in srgb,var(--ac) 22%,transparent)}
input[type=text]{flex:1;min-width:0}
textarea{width:100%;min-height:200px;resize:vertical;line-height:1.6}
.pb{background:var(--ac);color:var(--ac2);border:0;border-radius:14px;padding:10px 20px;cursor:pointer;font:700 18px Rubik,sans-serif;transition:transform .2s,box-shadow .2s}
.pb:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 8px 20px color-mix(in srgb,var(--ac) 30%,transparent)}
.pb:active{transform:scale(.92)}
.bad .nm{color:var(--mint);font-style:italic;text-decoration:underline wavy 1px;text-underline-offset:4px}
.tag{font-size:11px;color:var(--mu);font-weight:300}
.wk{display:flex;gap:3px}
.wk i{width:14px;height:14px;border-radius:5px;background:var(--c2);display:block;transition:transform .2s}
